<div class="goals-tab">
  <div class="goals-table-scroll">
    <table class="goals-excel-table" id="goalsTable">
      <colgroup>
        <col class="goals-col-metric" />
        <col class="goals-col-value" />
        <col class="goals-col-value" />
        <col class="goals-col-value" />
        <col class="goals-col-percent" />
        <col class="goals-col-reason" />
      </colgroup>

      <thead>
        <tr>
          <th class="goals-main-title" colspan="6">
            ЦЕЛИ НА ТЕКУЩИЙ ДЕНЬ
          </th>
        </tr>

        <tr>
          <th class="goals-sub-title" colspan="6">
            ЦЕЛИ НА ДЕНЬ
            <span>
              (учитывайте приоритеты ресторана, план действий PACE\Обейя):
            </span>
          </th>
        </tr>

        <tr>
          <th></th>

          <th>
            Результат за предыдущий день
          </th>

          <th>
            Цели на текущий день
          </th>

          <th>
            Результат за текущий день
          </th>

          <th class="goals-percent-title">
            %
          </th>

          <th>
            Выполнение цели:

            <small>
              (в случае невыполнения цели описываем причины)
            </small>
          </th>
        </tr>
      </thead>

      <tbody id="goalsBody">
        <tr>
          <td colspan="6">
            Загрузка...
          </td>
        </tr>
      </tbody>
    </table>

    <div class="goals-priorities">
      <div class="goals-priorities-title">
        ЦЕЛИ НА ДЕНЬ
      </div>

      <!-- ПРИОРИТЕТ 1 -->
      <div class="goals-priority-block">
        <div class="goals-priority-title">
          Приоритет 1
        </div>

        <div class="goals-priority-picker">
          <select
            id="goalPrioritySelect1"
            class="goals-priority-select"
            data-priority-select="1"
            aria-label="Готовая цель для приоритета 1"
          >
            <option value="">
              Выберите готовую цель
            </option>
          </select>

          <button
            type="button"
            class="goals-priority-clear"
            data-priority-clear="1"
          >
            Очистить
          </button>
        </div>

        <textarea
          id="goalPriority1"
          class="goals-priority-input"
          placeholder="Выберите готовую цель или введите свою"
        ></textarea>
      </div>

      <!-- ПРИОРИТЕТ 2 -->
      <div class="goals-priority-block">
        <div class="goals-priority-title">
          Приоритет 2
        </div>

        <div class="goals-priority-picker">
          <select
            id="goalPrioritySelect2"
            class="goals-priority-select"
            data-priority-select="2"
            aria-label="Готовая цель для приоритета 2"
          >
            <option value="">
              Выберите готовую цель
            </option>
          </select>

          <button
            type="button"
            class="goals-priority-clear"
            data-priority-clear="2"
          >
            Очистить
          </button>
        </div>

        <textarea
          id="goalPriority2"
          class="goals-priority-input"
          placeholder="Выберите готовую цель или введите свою"
        ></textarea>
      </div>

      <!-- ПРИОРИТЕТ 3 -->
      <div class="goals-priority-block">
        <div class="goals-priority-title">
          Приоритет 3
        </div>

        <div class="goals-priority-picker">
          <select
            id="goalPrioritySelect3"
            class="goals-priority-select"
            data-priority-select="3"
            aria-label="Готовая цель для приоритета 3"
          >
            <option value="">
              Выберите готовую цель
            </option>
          </select>

          <button
            type="button"
            class="goals-priority-clear"
            data-priority-clear="3"
          >
            Очистить
          </button>
        </div>

        <textarea
          id="goalPriority3"
          class="goals-priority-input"
          placeholder="Выберите готовую цель или введите свою"
        ></textarea>
      </div>
    </div>
  </div>
</div>
